apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Needed for autolinking
}

def configuredBuildRoot = providers.gradleProperty("TRICKEE_VR_ANDROID_BUILD_ROOT").orNull
def checkoutIsSynced = rootDir.absolutePath.toLowerCase(Locale.ROOT).contains("${File.separator}onedrive${File.separator}")
if (configuredBuildRoot || checkoutIsSynced) {
    def externalBuildRoot = file(configuredBuildRoot ?: "${System.getenv('LOCALAPPDATA')}\\Trickee\\vrtrickee-android-build")
    layout.buildDirectory.set(new File(externalBuildRoot, "app"))
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'
def releaseSigningPropertiesFile = rootProject.file("signing.properties")
def releaseSigningProperties = new Properties()
def hasReleaseSigning = releaseSigningPropertiesFile.exists()
if (hasReleaseSigning) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def privateApplicationId = "com.trickeeandroid"
def publicApplicationId = "com.trickee.vrtrickee"
def requestedApplicationId = project.findProperty("trickeeApplicationId") ?: privateApplicationId
if (!(requestedApplicationId in [privateApplicationId, publicApplicationId])) {
    throw new GradleException("Unsupported Trickee application ID: ${requestedApplicationId}")
}
def requestedAppLabel = requestedApplicationId == publicApplicationId ? "VRTrickee" : "Trickee"
if (requestedApplicationId == publicApplicationId && !hasReleaseSigning) {
    throw new GradleException("Public VRTrickee releases require android/signing.properties")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.trickeeandroid"
    defaultConfig {
        applicationId requestedApplicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.9"
        manifestPlaceholders = [appLabel: requestedAppLabel]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseSigningProperties['storeFile'])
                storePassword releaseSigningProperties['storePassword']
                keyAlias releaseSigningProperties['keyAlias']
                keyPassword releaseSigningProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.13.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // React Native Vector Icons
    // implementation project(':react-native-vector-icons')
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

// Gradle 8 validates task inputs before release lint runs. The vector-icons
// script supplies generated font assets but does not wire that copy task into
// Android Gradle Plugin's lint model writer, so assembleRelease can otherwise
// fail with an implicit-dependency error when the build directory is external.
tasks.matching { it.name.startsWith("generate") && it.name.endsWith("LintVitalReportModel") }.configureEach {
    dependsOn(tasks.named("copyReactNativeVectorIconFonts"))
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
