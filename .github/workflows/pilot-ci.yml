name: Pilot CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migration sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./trickee_ci.db
      SECRET_KEY: ci-secret-key-not-production
      LEGACY_AUTH_ENABLED: "false"
      LIVE_STATE_REDIS_ENABLED: "false"
      EXTERNAL_CONTEXT_REDIS_CACHE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: production/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app alembic

      - name: Check Alembic has one head
        shell: bash
        run: |
          alembic heads | tee /tmp/alembic-heads.txt
          head_count="$(grep -c "(head)" /tmp/alembic-heads.txt)"
          if [ "$head_count" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $head_count."
            exit 1
          fi

      - name: Run backend tests
        run: pytest tests -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production/trickee-frontend
    env:
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_LEGACY_AUTH_ENABLED: "false"
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: production/trickee-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  secret-safety:
    name: Secret and env safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block tracked local env files
        shell: bash
        run: |
          tracked_env="$(
            git ls-files \
              | grep -E '(^|/)\.env($|[.][^/]+$)' \
              | grep -Ev '(^|/)\.env(\.production)?\.example$' \
              || true
          )"
          if [ -n "$tracked_env" ]; then
            echo "Tracked local env file(s) detected. Remove them from git:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Block tracked service account files
        shell: bash
        run: |
          tracked_secret_files="$(
            git ls-files \
              | grep -Ei '(^|/)(service-account|.*firebase-adminsdk.*)\.json$' \
              || true
          )"
          if [ -n "$tracked_secret_files" ]; then
            echo "Tracked service account file(s) detected. Remove them from git:"
            echo "$tracked_secret_files"
            exit 1
          fi
