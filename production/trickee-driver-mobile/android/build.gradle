// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        maven {
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral {
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        maven { url 'https://www.jitpack.io' }
    }
}

subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.core' && details.requested.name == 'core') {
                details.useVersion '1.13.1'
            }
            if (details.requested.group == 'androidx.core' && details.requested.name == 'core-ktx') {
                details.useVersion '1.13.1'
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"

// Native Android builds from a OneDrive checkout can exceed Windows' object
// path limit and can have generated Ninja files rewritten while compilation is
// in progress. Keep disposable compiler output in a short, non-synced path.
def configuredBuildRoot = providers.gradleProperty("TRICKEE_VR_ANDROID_BUILD_ROOT").orNull
def checkoutIsSynced = rootDir.absolutePath.toLowerCase(Locale.ROOT).contains("${File.separator}onedrive${File.separator}")
if (configuredBuildRoot || checkoutIsSynced) {
    def externalBuildRoot = file(configuredBuildRoot ?: "${System.getenv('LOCALAPPDATA')}\\Trickee\\vrtrickee-android-build")
    subprojects { subproject ->
        def relativeName = subproject.path.tokenize(':').join(File.separator)
        subproject.layout.buildDirectory.set(new File(externalBuildRoot, relativeName))
        subproject.plugins.withId("com.android.library") {
            if (subproject.name == "react-native-reanimated") {
                subproject.extensions.getByName("android").externalNativeBuild.cmake.buildStagingDirectory =
                    new File(externalBuildRoot, "cxx${File.separator}react-native-reanimated")
                subproject.tasks.configureEach { task ->
                    if (task.name.startsWith("buildCMake")) {
                        task.doNotTrackState("Windows NDK outputs libc++_shared.so as a hard link")
                        task.doLast {
                            def nativeOutputRoot = new File(
                                subproject.layout.buildDirectory.get().asFile,
                                "intermediates${File.separator}cxx"
                            )
                            fileTree(nativeOutputRoot).matching {
                                include "**/libc++_shared.so"
                            }.files.each { linkedRuntime ->
                                def regularCopy = new File(linkedRuntime.parentFile, "${linkedRuntime.name}.copy")
                                java.nio.file.Files.copy(
                                    linkedRuntime.toPath(),
                                    regularCopy.toPath(),
                                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                                )
                                java.nio.file.Files.move(
                                    regularCopy.toPath(),
                                    linkedRuntime.toPath(),
                                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                                )
                            }
                        }
                    }
                }
            }
        }
    }
}
